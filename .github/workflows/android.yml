name: Build Ahsani Lesson Scanner APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          validate-wrappers: false

      - name: Repair Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.14.3

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save repaired Gradle Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar
          git add android/gradle/wrapper/gradle-wrapper.properties
          git add android/gradlew
          git add android/gradlew.bat
          git diff --cached --quiet || git commit -m "fix: regenerate Gradle wrapper"
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ahsani-lesson-scanner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
